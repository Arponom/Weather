services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d weather"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
